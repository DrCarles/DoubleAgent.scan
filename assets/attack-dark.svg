<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="Attack flow: an attacker hides instructions in AGENTS.md through a pull request, template or snippet. You review it and it looks fine, but the AI agent reads everything and runs the hidden instructions.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    .title { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub { font: 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .edge { font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .line { stroke: #8b949e; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="840" height="230" rx="16" fill="#0d1117"/>

  <rect x="20" y="88" width="130" height="54" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="85" y="112" class="title" text-anchor="middle">Attacker</text>
  <text x="85" y="130" class="sub" text-anchor="middle">hides instructions</text>

  <path d="M150 115 H246" class="line"/>
  <text x="198" y="104" class="edge" text-anchor="middle">PR, template,</text>
  <text x="198" y="134" class="edge" text-anchor="middle">snippet</text>

  <rect x="250" y="88" width="140" height="54" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="320" y="112" class="title" text-anchor="middle">AGENTS.md</text>
  <text x="320" y="130" class="sub" text-anchor="middle">looks normal</text>

  <path d="M390 105 C430 105 430 50 470 50" class="line"/>
  <path d="M390 125 C430 125 430 180 470 180" class="line"/>

  <rect x="474" y="23" width="160" height="54" rx="10" fill="#12261e" stroke="#2ea043"/>
  <text x="554" y="47" class="title" text-anchor="middle">You review it</text>
  <text x="554" y="65" class="sub" text-anchor="middle" fill="#3fb950">"looks fine"</text>

  <rect x="474" y="153" width="160" height="54" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="554" y="177" class="title" text-anchor="middle">AI agent</text>
  <text x="554" y="195" class="sub" text-anchor="middle">reads everything</text>

  <path d="M634 180 H676" class="line"/>

  <rect x="680" y="153" width="140" height="54" rx="10" fill="#3d1418" stroke="#f85149"/>
  <text x="750" y="177" class="title" text-anchor="middle" fill="#ff7b72">Runs the hidden</text>
  <text x="750" y="195" class="title" text-anchor="middle" fill="#ff7b72">instructions</text>
</svg>
